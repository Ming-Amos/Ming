<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus — a little room for progress</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #233a39; background: #f3f5f0; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 44px 24px; }
    main { width: min(100%, 780px); margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 54px; }
    .brand { font-size: 25px; font-weight: 800; letter-spacing: -1px; }
    .caption { color: #647673; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: clamp(32px, 5vw, 44px); line-height: 1.12; letter-spacing: -1.8px; font-weight: 600; margin: 0 0 14px; }
    .intro { color: #647673; font-size: 15px; margin: 0 0 34px; line-height: 1.6; }
    .workspace { padding: 28px; background: #fff; border: 1px solid #dce4de; border-radius: 18px; box-shadow: 0 10px 28px #294d3910; }
    label { display: block; font-size: 13px; font-weight: 650; margin-bottom: 9px; }
    .input-row { display: flex; gap: 10px; }
    input { flex: 1; min-width: 0; padding: 13px 15px; border: 1px solid #cbd6d0; border-radius: 9px; color: #233a39; background: #fafcf9; font: inherit; font-size: 14px; }
    button { font: inherit; cursor: pointer; }
    input:focus-visible, button:focus-visible { outline: 3px solid #e1ad47; outline-offset: 3px; }
    .add { padding: 12px 20px; border: 0; border-radius: 9px; background: #28554b; color: #fff; font-weight: 600; white-space: nowrap; }
    .add:hover { background: #1f443c; }
    #form-message { font-size: 13px; min-height: 20px; margin: 9px 0 18px; color: #a04031; }
    .list-header { display: flex; align-items: center; justify-content: space-between; padding-top: 22px; border-top: 1px solid #e7ece8; gap: 12px; }
    h2 { font-size: 14px; margin: 0; font-weight: 650; }
    #task-summary { color: #647673; font-size: 12px; }
    #task-items { list-style: none; padding: 0; margin: 14px 0 0; }
    .task-row { display: flex; align-items: center; gap: 13px; padding: 17px 0; border-bottom: 1px solid #edf1ed; }
    .task-row:last-child { border-bottom: 0; }
    .toggle { flex: 0 0 25px; width: 25px; height: 25px; padding: 0; border-radius: 8px; border: 1.5px solid #bccbc3; color: #fff; background: #fff; font-size: 15px; }
    .is-complete .toggle { background: #28554b; border-color: #28554b; }
    .task-title { flex: 1; min-width: 0; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
    .is-complete .task-title { text-decoration: line-through; color: #71817a; }
    .task-state { flex-shrink: 0; font-size: 11px; padding: 4px 8px; color: #6a756d; border-radius: 6px; background: #f0f3ef; }
    .is-complete .task-state { background: #edf6ee; color: #346747; }
    .empty { text-align: center; padding: 35px 14px; color: #73827b; font-size: 14px; line-height: 1.7; }
    footer { margin-top: 22px; font-size: 12px; color: #6d7f76; display: flex; justify-content: space-between; gap: 16px; }
    @media (max-width: 520px) { body { padding: 28px 16px; } header { margin-bottom: 36px; } .workspace { padding: 20px; } .input-row { flex-direction: column; } .add { align-self: flex-start; } .task-state { font-size: 10px; } footer { flex-direction: column; gap: 6px; } }
  </style>
</head>
<body>
  <main>
    <header><div class="brand">Focus<span aria-hidden="true">.</span></div><span class="caption">One thing at a time</span></header>
    <h1>A little room<br>for progress.</h1>
    <p class="intro">Write it down. Give it your attention. Enjoy checking it off.</p>
    <section class="workspace" aria-label="Task workspace">
      <form id="new-task-form" novalidate>
        <label for="task-title-input">What needs doing?</label>
        <div class="input-row"><input id="task-title-input" aria-label="New task" placeholder="A small next step…" maxlength="180" autocomplete="off"><button class="add" type="submit">Add task</button></div>
        <p id="form-message" role="alert" aria-live="polite"></p>
      </form>
      <div class="list-header"><h2>Your tasks</h2><span id="task-summary" aria-live="polite"></span></div>
      <ul id="task-items" aria-label="Your task list"></ul>
    </section>
    <footer><span>Small steps add up.</span><span>Ming acceptance sample · persistence defect</span></footer>
  </main>
  <script>
    const STORAGE_KEY = 'ming_focus_buggy_v1';
    const input = document.getElementById('task-title-input');
    const message = document.getElementById('form-message');
    let tasks = [];
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      if (Array.isArray(saved)) tasks = saved.filter(task => task && typeof task.id === 'string' && typeof task.title === 'string' && typeof task.completed === 'boolean');
    } catch { message.textContent = 'Saved tasks could not be loaded. You can start a new list.'; }

    function saveTasks() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
      catch { message.textContent = 'Your browser could not save these changes.'; }
    }

    function renderTasks() {
      const list = document.getElementById('task-items');
      list.replaceChildren();
      document.getElementById('task-summary').textContent = `${tasks.filter(task => task.completed).length} of ${tasks.length} completed`;
      if (tasks.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = 'A clear space. Add your first task above.';
        list.append(empty);
        return;
      }
      for (const task of tasks) {
        const row = document.createElement('li');
        row.className = `task-row${task.completed ? ' is-complete' : ''}`;
        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'toggle';
        toggle.setAttribute('aria-label', task.completed ? 'Mark incomplete' : 'Mark complete');
        toggle.setAttribute('aria-pressed', String(task.completed));
        toggle.textContent = task.completed ? '✓' : '';
        toggle.addEventListener('click', () => {
          task.completed = !task.completed;
          // Intentional demo defect: completion changes are not persisted.
          // The creation handler still saves the task's initial state.
          renderTasks();
          document.querySelectorAll('.toggle')[tasks.indexOf(task)]?.focus();
        });
        const title = document.createElement('span');
        title.className = 'task-title';
        title.textContent = task.title;
        const state = document.createElement('span');
        state.className = 'task-state';
        state.textContent = task.completed ? 'Completed' : 'To do';
        row.append(toggle, title, state);
        list.append(row);
      }
    }

    document.getElementById('new-task-form').addEventListener('submit', event => {
      event.preventDefault();
      const title = input.value.trim();
      if (!title) { message.textContent = 'Write a task before adding it.'; input.focus(); return; }
      message.textContent = '';
      tasks.push({ id: crypto.randomUUID(), title, completed: false });
      saveTasks();
      input.value = '';
      renderTasks();
      input.focus();
    });
    renderTasks();
  </script>
</body>
</html>
